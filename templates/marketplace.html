{% extends "base.html" %} {% block title %}Marketplace - EcoMitra{% endblock %}
{% block content %}
<div class="container" style="max-width: 900px; margin: 2rem auto">
  <h1>Marketplace for Recycled Items</h1>
  <p>
    Give away cardboard, scrap, clothing, electronics — connect with recyclers.
    Builds circular economy ♻️
  </p>

  <section
    style="
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    "
  >
    <h2>List an Item</h2>
    <form id="postForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
        <input
          type="text"
          id="title"
          placeholder="Item title (e.g., Cardboard sheets)"
          required
        />
        <select id="category" required>
          <option value="cardboard">Cardboard</option>
          <option value="scrap">Scrap</option>
          <option value="clothing">Clothing</option>
          <option value="electronics">Electronics</option>
          <option value="plastic">Plastic</option>
          <option value="paper">Paper</option>
          <option value="metal">Metal</option>
          <option value="glass">Glass</option>
        </select>
      </div>
      <textarea
        id="description"
        placeholder="Description..."
        style="width: 100%; margin-top: 8px"
      ></textarea>
      <input
        type="text"
        id="contact"
        placeholder="Contact info (optional)"
        style="width: 100%; margin-top: 8px"
      />
      <button type="submit" style="margin-top: 8px">Submit</button>
    </form>
  </section>

  <section
    style="
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    "
  >
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <h2>Browse Items</h2>
      <div>
        <select id="filterCategory">
          <option value="">All</option>
          <option value="cardboard">Cardboard</option>
          <option value="scrap">Scrap</option>
          <option value="clothing">Clothing</option>
          <option value="electronics">Electronics</option>
          <option value="plastic">Plastic</option>
          <option value="paper">Paper</option>
          <option value="metal">Metal</option>
          <option value="glass">Glass</option>
        </select>
        <button id="voiceSearchBtn" title="Voice search">
          🎤 Voice Search
        </button>
      </div>
    </div>
    <div id="itemsList" style="margin-top: 12px"></div>
  </section>
</div>

<script>
  async function loadItems(category = "") {
    const url = category
      ? `/api/marketplace/items?category=${encodeURIComponent(category)}`
      : "/api/marketplace/items";
    const res = await fetch(url);
    const items = await res.json();
    const container = document.getElementById("itemsList");
    if (!items || items.length === 0) {
      container.innerHTML = '<p style="color:#6b7280;">No items yet.</p>';
      return;
    }
    container.innerHTML = items
      .map(
        (i) => `
      <div style="padding:8px;border-bottom:1px dashed #e5e7eb;">
        <strong>${escapeHtml(
          i.title
        )}</strong> <span style="color:#6b7280;">(${escapeHtml(
          i.category
        )})</span><br/>
        <span>${escapeHtml(i.description || "")}</span><br/>
        <small style="color:#6b7280;">Contact: ${escapeHtml(
          i.contact || "N/A"
        )}</small>
      </div>
    `
      )
      .join("");
  }
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
  document.getElementById("postForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const res = await fetch("/api/marketplace/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, category, description, contact }),
    });
    if (!res.ok) {
      alert("Failed to submit item");
      return;
    }
    document.getElementById("postForm").reset();
    const filterCategory = document.getElementById("filterCategory").value;
    loadItems(filterCategory);
  });
  document.getElementById("filterCategory").addEventListener("change", (e) => {
    loadItems(e.target.value);
  });

  // Voice search using Web Speech API
  let recognition;
  function setupVoiceSearch() {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-IN";
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      // Very simple intent: if includes 'sell' or 'give away', prefill form
      const t = transcript.toLowerCase();
      if (t.includes("sell") || t.includes("give away")) {
        document.getElementById("title").value = "Old item";
        document.getElementById("description").value = transcript;
      }
      // Try to detect categories by keywords
      const catMap = {
        cardboard: ["cardboard", "box"],
        scrap: ["scrap", "metal", "iron"],
        clothing: ["clothes", "clothing", "shirt", "jeans"],
        electronics: ["laptop", "phone", "electronics", "charger"],
      };
      for (const [cat, kws] of Object.entries(catMap)) {
        if (kws.some((k) => t.includes(k))) {
          document.getElementById("category").value = cat;
          break;
        }
      }
    };
  }
  document.getElementById("voiceSearchBtn").addEventListener("click", () => {
    if (!recognition) setupVoiceSearch();
    if (recognition) {
      try {
        recognition.start();
      } catch (e) {}
    } else {
      alert("Voice search not supported in this browser.");
    }
  });

  // Initial load
  loadItems();
</script>
{% endblock %}
